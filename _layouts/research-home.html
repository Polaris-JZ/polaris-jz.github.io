<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Jujia Zhao — research in generative and agentic recommendation and LLM evaluation."><title>Jujia Zhao | Research</title><link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}"><style>
:root{--bg:#faf9f6;--ink:#202a35;--muted:#536272;--accent:#254f77;--line:#deded9;--paper:#fff;--purple:#704697}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:4px}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}h1,h2,h3,p{margin:0}h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:normal;letter-spacing:-.035em}h1{font-size:clamp(3rem,7vw,5.2rem);line-height:1.07;margin:12px 0 16px}h2{font-size:2.1rem;line-height:1.2}h3{font-size:1.03rem;line-height:1.4}p+p{margin-top:8px}.shell{max-width:1080px;margin:auto;padding:0 36px}.nav{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.nav .shell{display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:66px;flex-wrap:wrap}.brand{font-family:Georgia,serif;font-size:1.2rem;color:var(--ink);font-weight:bold}.nav-links{display:flex;gap:22px;flex-wrap:wrap;font-size:.86rem}.hero{display:grid;grid-template-columns:1fr 220px;gap:56px;align-items:center;padding:64px 0 48px}.eyebrow,.venue{font-size:.74rem;font-weight:700;letter-spacing:.075em;color:var(--accent);text-transform:uppercase}.lead{font-size:1.35rem;line-height:1.45;color:var(--accent);margin-bottom:18px}.hero p:not(.lead){max-width:690px}.portrait{width:100%;height:auto;max-height:290px;object-fit:cover;border-radius:5px;box-shadow:0 4px 18px #202a3510}.contact,.paper-links{display:flex;flex-wrap:wrap;gap:16px;font-size:.87rem;font-weight:600}.contact{margin-top:22px}section{padding:36px 0;border-top:1px solid var(--line)}.section-head{display:flex;align-items:baseline;gap:14px;margin-bottom:23px}.section-head span{font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.12em}.areas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.areas article{border-top:3px solid #345f84;padding-top:14px}.areas article:nth-child(2){border-color:#9475ae}.areas article:nth-child(3){border-color:#658878}.areas p,.feature p{color:var(--muted);font-size:.91rem;margin:9px 0 12px}.areas a{font-size:.84rem;font-weight:600}.features{display:grid;grid-template-columns:1fr 1fr;gap:16px}.feature{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:25px}.feature h3{font-family:Georgia,serif;font-size:1.8rem;margin-top:7px}.feature .feature-title{font-weight:600;color:var(--ink);margin-bottom:4px}.filter{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 15px}.filter button{border:1px solid var(--line);border-radius:4px;padding:6px 11px;font:inherit;font-size:.78rem;background:transparent;color:var(--muted);cursor:pointer}.filter button[aria-pressed=true]{background:var(--accent);color:white;border-color:var(--accent)}.publication{display:grid;grid-template-columns:130px 1fr;gap:20px;padding:17px 0;border-bottom:1px solid var(--line)}.publication[hidden]{display:none}.publication h3 a{color:var(--ink)}.authors{font-size:.86rem;color:var(--muted);margin:4px 0}.publication .paper-links{font-size:.8rem}.experience,.education{display:flex;align-items:flex-start;gap:18px;justify-content:space-between;padding:14px 0}.experience+.experience,.education+.education{border-top:1px solid var(--line)}.experience p{font-size:.92rem}.tag{display:inline-block;background:#eee5f6;color:var(--purple);font-size:.7rem;padding:3px 7px;border-radius:3px;vertical-align:middle;margin-left:5px}.muted,time{color:var(--muted)}time{font-size:.82rem;white-space:nowrap}.small{font-size:.82rem}.news{padding:0;margin:0;list-style:none}.news li{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:7px 0}.education{justify-content:flex-start;align-items:center}.education img{width:55px;height:48px;object-fit:contain}.education time{margin-left:auto}.education p{font-size:.88rem}footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:.8rem}.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;background:white;padding:8px;z-index:3}@media(max-width:720px){.shell{padding:0 20px}.nav .shell{padding-top:12px;padding-bottom:12px;gap:6px}.nav-links{gap:14px;font-size:.8rem}.hero{grid-template-columns:1fr 110px;gap:20px;padding:36px 0}.portrait{align-self:start;margin-top:30px}.areas{grid-template-columns:1fr;gap:20px}.features{grid-template-columns:1fr}.publication{grid-template-columns:1fr;gap:4px}.experience{flex-wrap:wrap;gap:4px}.education{flex-wrap:wrap;gap:10px}.education time{margin-left:65px}.lead{font-size:1.1rem}section{padding:28px 0}h2{font-size:1.85rem}}@media(max-width:430px){.hero{display:flex;flex-direction:column-reverse;align-items:flex-start;gap:16px}.portrait{width:105px;margin-top:0}.nav-links{gap:12px}.education time{margin-left:0;width:100%;padding-left:65px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body><a class="skip" href="#about">Skip to content</a><nav class="nav" aria-label="Main navigation"><div class="shell"><a class="brand" href="#about">Jujia Zhao</a><div class="nav-links"><a href="#research">Research</a><a href="#publications">Publications</a><a href="#experience">Experience</a><a href="#news">News</a><a href="#service">Service</a></div></div></nav><main class="shell">{{ content }}</main><footer><div class="shell">© {{ site.time | date: '%Y' }} Jujia Zhao</div></footer><script>const buttons=document.querySelectorAll('[data-filter]');const papers=document.querySelectorAll('[data-topic]');function filter(topic){buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===topic)));papers.forEach(p=>p.hidden=topic!=='all'&&p.dataset.topic!==topic)}buttons.forEach(b=>b.addEventListener('click',()=>filter(b.dataset.filter)));document.querySelectorAll('a[href^="#pub-"]').forEach(a=>a.addEventListener('click',()=>filter('all')));</script></body></html>
